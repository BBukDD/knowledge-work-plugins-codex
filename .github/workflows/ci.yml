name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run offline tests
        run: uv run --no-project --python 3.11 --with 'pytest>=8,<10' python -m pytest -q tests
      - name: Validate distributed plugins
        run: python tools/validate.py --project .
      - name: Compare packages with pinned upstream source
        run: |
          git clone https://github.com/anthropics/knowledge-work-plugins.git "$RUNNER_TEMP/knowledge-work-plugins"
          git -C "$RUNNER_TEMP/knowledge-work-plugins" checkout 33d3dea41a341b341d4f5da2e8801ae0c89be2b8
          python tools/build.py --source "$RUNNER_TEMP/knowledge-work-plugins" --output plugins --check
